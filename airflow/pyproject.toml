[project]
name = "de-pipeline-airflow"
version = "0.1.0"
description = "Airflow for the pipeline, in an environment of its own: Airflow does not run natively on Windows."
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==3.3.2",
    "duckdb==2.0.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
